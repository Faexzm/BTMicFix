name: BTMicFix APK Builder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="app/build_tmp/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK successfully generated!"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTMicFix-debug-APK
          path: app/build_tmp/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
